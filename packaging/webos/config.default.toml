# webos-satellite configuration written by the webOS app on its first install
# (ctl.sh install). Updates and reinstalls keep this file; edit it over SSH
# and restart (ctl.sh restart). Every key and its default:
# https://github.com/pando85/webos-voice-satellite/blob/main/config/example.toml
#
# @NAME@ and @MAC_SEED@ are replaced once with random values, so every TV is
# a separate device in Home Assistant and keeps its identity across updates.
mode = "wake"

[device]
name = "@NAME@"
friendly_name = "TV Voice Satellite"
mac_seed = "@MAC_SEED@"
port = 6053
# No key here: Home Assistant 2026.9 or newer sets one when you add the
# device (pairing below). For a fixed key instead, put it in etc/noise_psk
# (mode 0600), uncomment the next line and set [pairing] enabled = false.
# noise_psk_file = "noise_psk"
# mDNS is not yet verified with Home Assistant discovery on a TV: add the
# device in HA by host and port (the app shows the TV's address).
mdns = false

[mic]
source = "alsa"
card_id = "LGSIC"
pcm_name = "WoV PDM Mic"

[sink]
type = "pacat"
gain = 1.0
# Reply volume in percent until Home Assistant sets one on the satellite's
# media player (then stored in etc/reply_volume). 40 is -30 dB: replies stay
# comfortable even with a loud TV volume.
volume = 40

[power]
# The TV power state is shown in Home Assistant. "When the TV is turned off
# with the remote" is a select there (default: turn off normally).
watch = true

[log]
level = "info"

# Echo cancellation (removes the TV's own sound from the microphone) is on by
# default since 0.4.3. To turn it off, uncomment both lines and restart
# (ctl.sh restart). Every key: config/example.toml ([aec]).
# [aec]
# enabled = false

[safety]
# Kill switch (the app's "Microphone off"): the PCM stays closed while it
# exists. Under /tmp it is cleared at reboot.
kill_switch = "/tmp/webos-satellite.disable"
# Home Assistant's mute switch, remembered across restarts and reboots.
mute_file = "muted"
# Firmware policy. "warn" (default): the microphone starts on any firmware; an
# unverified one is logged, shown in Home Assistant and in the app, and the
# microphone self-check runs. If something does not work, press "Report
# compatibility" in the app (or run ctl.sh report): you get a prefilled GitHub
# issue to review and submit. "strict": the old hard gate, the microphone stays
# off on a firmware that is not in validated_firmware (an empty list = no gate).
firmware_policy = "warn"
# validated_firmware = ["03.30.74"]   # your own list, used by "strict"
# self_check = true                   # measure the first seconds of the capture stream

# [report]
# enabled = true
# repo = "pando85/webos-voice-satellite"   # where the report link points; nothing is sent

[pairing]
# While no key is stored the pairing window opens at every start for
# window_s seconds; whoever connects first on the LAN in that time can claim
# the device, so add it in Home Assistant right after starting.
enabled = true
state_dir = "pairing"
window_s = 600
open_on_start = true

[music]
# Music from Home Assistant and Music Assistant on the satellite's media
# player (experimental, not yet evaluated on a TV). Off: the media player
# plays replies, announcements and the timer alarm only. Every key:
# config/example.toml ([music]). Restart after a change.
enabled = false
