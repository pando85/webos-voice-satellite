# webos-satellite configuration (TOML). Every key is optional; the values
# shown are the defaults unless marked "example". Relative paths are resolved
# against the directory of this file. Command-line options override the file
# (see `webos-satellite --help`). Check a file with `--check-config`: it
# rejects unknown keys and bad values (naming the key) and prints warnings,
# for example when noise_psk_file is readable by group or other.
# Reference: docs/development.md#configuration-reference

# "wake": stream continuously while Home Assistant runs the wake word
#         (server-side openWakeWord, ADR 0003).
# "ptt":  push-to-talk; each SIGUSR1 starts one run at speech-to-text.
mode = "wake"

[device]
# ESPHome node name: lowercase letters, digits and '-', at most 31 chars.
# Must be unique among the ESPHome devices in your Home Assistant.
name = "webos-satellite"
friendly_name = "TV Voice Satellite"
# Stable MAC-style id that HA uses as the device's unique id. Either set it
# (example: "02:00:00:00:00:01", a locally administered address) or leave it
# unset and set mac_seed; with neither, it is derived from `name`.
# mac = "02:00:00:00:00:01"
# mac_seed = "some-random-stable-string"
model = "LG webOS TV"
bind = "0.0.0.0"
port = 6053
# Noise encryption key: base64 of 32 random bytes, the same value you enter
# as "encryption key" in HA. Keep it in a private file (mode 0600), e.g.
#   head -c 32 /dev/urandom | base64 > noise_psk && chmod 600 noise_psk
# Never commit it. `noise_psk = "..."` inline is accepted but not advised.
noise_psk_file = "noise_psk"
# Without a key the device refuses to start unless this is true
# (plaintext, development only).
allow_plaintext = false
# Advertise _esphomelib._tcp over mDNS. HA in a container/pod usually cannot
# see mDNS; add the device by host and port instead.
mdns = false
# Voice features advertised to HA (default 31 = announce and timers). Each is
# a bit of the ESPHome voice feature flags; the satellite behaves the same
# whether or not a bit is advertised, the bit only decides what HA offers.
# announce: HA may send announcements (bit 16). Needed for start_conversation.
announce = true
# timers: HA forwards its voice timers (bit 8; "set a timer for 5 minutes"
# then works for this device, no extra HA setup). The satellite logs each
# change (id, event, seconds only; never the timer name), shows a "Timers"
# sensor in HA and rings an alarm when a timer finishes. Set false to turn
# all of it off (default flags 23).
timers = true
# Longest one timer alarm rings, in seconds, if nobody stops it (the wake
# word, the "Stop timer alarm" button or the media player stop). 0 turns the
# sound off (timers are still tracked). At most 3600. The alarm plays at the
# reply volume (the media player's slider in HA).
timer_alarm_max_s = 300
# start_conversation: lets the assist_satellite.start_conversation service
# be called for this device (bit 32). Needs announce = true.
start_conversation = false

[mic]
# "alsa": the TV's built-in mic. "file": a raw recording (tests on a PC).
source = "alsa"
# ALSA: the card is found by id and the PCM by name (never by index).
card_id = "LGSIC"
pcm_name = "WoV PDM Mic"
# device = 0             # explicit PCM number, overrides pcm_name
rate = 16000             # must be 16000 (HA's rate; no resampling)
channels = 2
period_frames = 256      # the only period/buffer sizes c3-a accepts
buffer_frames = 8192
discard_ms = 250         # startup burst dropped after every (re)start
# File source: raw S24_LE interleaved (what `arecord -f S24_LE -t raw` writes),
# with `rate` and `channels` as above.
# path = "recording.raw" # example
realtime = true          # pace reads like a live mic
loop = false             # restart at end of file
skip_ms = 250            # skip the start of the file (startup burst)
pause_when_idle = true   # advance the file only while streaming to HA

[dsp]
channel = "left"         # "left" (ch0, ADR 0004), "right" or "mix"
gain_db = 24.0           # fixed gain; the C3 mic is quiet and has no AGC
hpf_hz = 120.0           # high-pass cutoff, 0 disables

[sink]
# "pacat": PulseAudio (the TV). "wav": one WAV file per reply in `dir`.
# "null": discard.
type = "pacat"
# Software gain on every sample written to pacat: 1.0 unity, 0.0 digital
# silence. On c3-a `pacat --volume` is ignored, so this is the level control;
# use 0.0 for silent tests.
gain = 1.0
binary = "pacat"
# device = "pcm_output"  # example PulseAudio sink; unset = default sink
# Streamed TTS (HA's default for this device) is sent to pacat at its native
# 16 kHz mono. rate/channels apply to decoded URL media (announcements).
rate = 44100
channels = 2
# pacat --latency-msec for replies and announcements. 0 = PulseAudio's
# default buffering (about 2 s), which delayed the start of short streamed
# replies by about 1.5 s on c3-a; 200 started them within about 0.1 s.
latency_msec = 200
dir = "."                # wav sink output directory
# Reply volume in percent, independent of the TV's own volume: an in-process
# gain on replies, announcements and the timer alarm before pacat, on a
# decibel taper: 100 = unity (0 dB), each percent below is 0.5 dB quieter
# (50 = -25 dB, 40 = -30 dB), 0 = silent. Home Assistant sets it with the
# volume of the satellite's media player; that value is stored in
# volume_file and wins over `volume` after the first change. The default is
# conservative for a TV that is often at a high volume. It multiplies `gain`.
volume = 40
volume_file = "reply_volume"

[log]
# error | warn | info | debug | trace. Audio is never logged; transcripts and
# reply text appear only at debug.
level = "info"

[safety]
# Kill switch: while this file exists the microphone PCM is closed (the
# hardware mic is released), nothing is streamed, and Home Assistant sees
# the "Mute microphone" switch on and cannot turn it off. Checked at startup
# and every 250 ms. `touch` it to stop listening, `rm` it to resume.
kill_switch = "/tmp/webos-satellite.disable"
# Remembers HA's mute switch across daemon restarts (created on mute, removed
# on unmute). Under /tmp it is lost at reboot; put it in a persistent
# directory if a mute must survive reboots.
mute_file = "/tmp/webos-satellite.muted"
# Firmware policy (ADR 0006, docs/design/firmware-policy-and-reports.md).
# "warn" (default): the microphone starts on any firmware. A firmware or model
# that is not in the verified list (data/verified-models.toml, matched by
# series and firmware) shows as "not verified" in HA (Compatibility,
# Firmware verified), the log and the TV app, and the microphone self-check
# measures the capture path. "strict": the old gate; on a firmware that is not
# in validated_firmware the microphone stays off (shown as muted in HA).
# `webos-satellite --check-firmware` prints the status (exit 0 verified, 1 not
# verified or unreadable, 3 strict with an empty list). File-mic tests are
# not gated.
firmware_policy = "warn"
# Firmware versions (webos_manufacturing_version) you validated yourself. In
# "strict" mode the only versions allowed (empty: the gate is off); in "warn"
# mode they count as verified on top of the built-in list. Empty is normal.
validated_firmware = []
firmware_info = "/var/run/nyx/os_info.json"
# The firmware the daemon last ran on (one line). Written at the first start
# and when "Acknowledge firmware change" is pressed (HA button or
# `ctl.sh ack-firmware`); a different current firmware is shown as "firmware
# changed" until then. Not set: firmware_seen next to this file.
# firmware_seen_file = "firmware_seen"
# Microphone self-check: on the first open after a start, after a firmware
# change and on request (HA button "Re-run microphone check", `ctl.sh
# selfcheck`) the daemon looks at the levels of the normal capture stream for
# self_check_window_s seconds (no extra open, no recording, no sysfs). A
# measured failure (no audio frames, a stuck signal, no capture device) closes
# the microphone with bounded retries and shows "capture problem"; a warning
# (very quiet, clipping) leaves it open.
self_check = true
self_check_window_s = 10

[report]
# The compatibility report (docs/compatibility/verified-models.md): built from
# a fixed list of fields (never a serial, address, name, key, audio or
# transcript) and shown in the TV app (QR code) and by `ctl.sh report`. The
# daemon sends nothing anywhere.
enabled = true
# The GitHub repository the prefilled issue link points at (owner/name).
repo = "pando85/webos-voice-satellite"
# Where the daemon writes report.json, report.short.txt, report.full.txt,
# report.url and compat.json and looks for the trigger files selfcheck-run and
# firmware-ack. Not set: ../run next to a config in a directory named etc (the
# TV layout), else /tmp/webos-satellite.
# dir = "/tmp/webos-satellite"

[limits]
nice = 10                # scheduling niceness (also applies to pacat)
max_open_files = 256     # soft RLIMIT_NOFILE; 0 keeps the inherited limit
max_rss_mb = 64          # exit (code 72) above this resident size; 0 = off
capture_stall_s = 5      # reopen the ALSA device after this long without audio
loop_stall_s = 30        # exit (code 70/71) if the event loop or capture thread hangs

[power]
# Subscribe to the TV power state (luna getPowerState through a supervised
# `luna-send -i` child on a pseudo-terminal), log each change at info and
# show it as the diagnostic "TV power state" sensor in Home Assistant. Turned
# off by itself when luna_send is not found (on a PC). Also used to notice a
# resume from a system suspend (as is a jump of CLOCK_BOOTTIME).
watch = true
luna_send = "luna-send"  # a name is looked up in PATH, then /usr/bin, /bin, ...
# What happens after the TV is turned off with the remote. Home Assistant's
# select "When the TV is turned off with the remote" changes it (stored in
# remote_off_file, which then wins over this value).
#   "normal":         LG's behaviour; the satellite does nothing (default).
#   "keep_listening": wake and darken: after a power-off by the remote (reason
#                     remoteKey only, never a timer, CEC or HomeKit) the
#                     satellite wakes the TV and turns its screen off, so it
#                     looks off while it keeps listening and replies stay
#                     audible. The TV stays on with a dark screen: it draws
#                     more than standby (not measured), LG's OLED care that
#                     runs at power-off may not run, the panel may light for
#                     about 0.3 to 0.7 s, and a second press of the power key
#                     takes about 5 s to turn the TV on. Design and evidence:
#                     docs/design/always-on.md section 12.
remote_off = "normal"
remote_off_file = "remote_off"
max_actions_per_hour = 10  # wake-and-darken actions allowed per hour
cooldown_s = 20            # minimum time between two of them

[tv_control]
# TV control from Home Assistant: extra entities on the satellite device that
# act on the TV itself (screen, power, volume, mute, input, apps). Design and
# evidence: docs/design/tv-control.md and docs/experiments/EXP-010-tv-control-setters.md.
# Needs luna-send and power.watch = true (on a PC every control is off by
# itself). Evidence is c3-b (firmware 03.30.73) only; c3-a is untested. A
# control whose TV call fails, or whose write does not read back, is switched
# off until a restart or a list refresh and shows no state: nothing is guessed.
enabled = true            # master switch
screen = true             # switch "TV screen": off = Screen Off (the satellite keeps listening)
power_on = true           # button "Turn on TV": Screen Off or Active Standby to on
# Switch "TV power (keep listening)": Home Assistant can turn the TV off, but
# only while the select "When the TV is turned off with the remote" is on
# "Keep listening (screen off)" and the wake-and-darken machine would act (no
# kill switch, cooldown and hourly budget of [power] apply). The TV then stays
# on with a dark screen: more power than standby, LG's OLED care at power-off
# may not run, a brief panel flash. Opt-in; not listed when false.
power_off = false
# On by default: the setters passed EXP-010 Part A on c3-b (firmware
# 03.30.73, 2026-11-04) and each control is checked per TV at startup (c3-a is
# untested). Set any of them to false to remove the entities.
volume = true             # number "TV volume" and the up/down buttons
# volume_limit = 40       # optional cap on the TV volume Home Assistant may set (LG steps, not
#                         # percent). Unset (default): no cap below the TV's own maxVolume,
#                         # which differs per TV (60 on c3-b). With a cap: sets above it are
#                         # clamped, "volume up" stops at it, the slider ends at it; a TV
#                         # already above it can still be lowered (down button, any value <= cap)
mute = true               # switch "TV mute"
input = true              # select "TV input" (the TV's external inputs)
apps = true               # select "TV app" (launcher apps)
app_limit = 30            # most apps in the "TV app" select
play_state = false        # sensor "TV play state"
# Media player "TV" (ADR 0007): the TV itself as a Home Assistant media player,
# so HA's own voice intents work on it once you give it an alias ("turn down
# the TV volume", "mute the TV", "turn off the TV"). Volume (share of the TV's
# maxVolume), up/down (one TV step), mute, turn on (as "Turn on TV") and turn
# off (the power-off above when it is on and the select is on "Keep listening",
# otherwise the screen off) follow the switches above. It plays nothing: no
# TTS, announcements or media go to it. Reads the play state every 10 s while
# the TV is lit to show "playing". The satellite's own media player (the reply
# volume) is a separate entity and does not change.
media_player = true
# Two read-only diagnostic sensors (ADR 0008): "Always Ready" (lg_always_ready:
# Off, On, On with wallpaper, Other) and "LG hands-free" (lg_hands_free: Off,
# On, Other). Two short luna getters every 60 s while the TV is lit, and at
# once after `ctl.sh set`. The satellite never writes either setting from here.
lg_settings = true
# Owner decision 2026-11-04: TV control is NOT gated by the firmware guard. On
# a firmware that is not in safety.validated_firmware it keeps working and the
# daemon logs a warning at startup (the microphone guard is separate). true
# refuses the TV control setters there instead (sensors still report). A
# failed setter is detected in either case and its control switched off.
follow_firmware_guard = false

[pairing]
# Pairing without typing a key: Home Assistant 2026.9 or newer generates the
# Noise key and sets it on the device (ESPHome "dynamic encryption key"). Only
# used when [device] has no noise_psk / noise_psk_file: an explicit key always
# wins and disables pairing. Mutually exclusive with allow_plaintext.
# While unpaired the microphone stays closed and a keyless connection gets
# only hello, device info, an empty entity list and the key exchange, and
# only while the pairing window is open. Whoever on the LAN connects first
# during the window can claim the device (HA's zero-PSK key exchange stops
# sniffing but authenticates nobody), so keep the window short.
enabled = false
# Holds the stored key (noise_psk, mode 0600) and the trigger files: create
# `pair` to open the window, `reset-pairing` to delete the stored key and
# reopen it (the daemon deletes the trigger file; CLI: --pair, --reset-pairing).
state_dir = "pairing"
window_s = 600           # the window closes after this, or once a key is set
open_on_start = true     # open the window when started without a stored key
                         # (not after HA cleared it on removal: then `pair`)

[aec]
# Acoustic echo cancellation: removes what the TV itself plays (programme
# audio and the satellite's own replies) from the mic before the gain, with
# WebRTC AEC3 (the pure Rust `sonora` crate). Design and measurements:
# docs/design/aec-frontend.md.
# ON by default since 0.4.3 with the "B + NS" configuration below (stereo
# render, noise suppression, the [aec.aec3] values). An owner product
# decision (2026-11-05): two live A/Bs on an LG C3 showed no harm and about
# 5 % of one core, but NO significant wake word gain (EXP-018, EXP-021).
# Turn it off with `enabled = false` (the settings toggle maps to this key;
# the daemon reads it at start, so restart it after a change; the HA switch
# "Echo cancellation" (aec_enabled) and the TV app do both). If the
# reference cannot be opened or fails, the mic runs without echo
# cancellation (logged as "aec: ... WITHOUT echo cancellation").
# Every key here is optional: a missing key keeps its default, a key set
# here overrides it.
enabled = true
# The reference is the TV's output, captured from a PCM on the mic's card
# (mic.card_id), matched by its id or name (never by index). On the LG C3
# (c3-a) "SoundEngineCapture" (hw:LGSIC,3) is post-volume and coherent with
# the speaker signal; "SpeakerFeedback" is not usable as a reference.
reference_pcm_id = "SoundEngineCapture"
# The values verified on c3-a: S32_LE, 2 ch, 48 kHz (its only rate), period
# 256 and buffer 8192 frames. 48000 is decimated to 16 kHz; 16000 is
# taken as is. reference_format: "s32_le" or "s24_le".
reference_format = "s32_le"
reference_channels = 2
reference_rate = 48000
reference_period_frames = 256
reference_buffer_frames = 8192
# Start mic and reference on one trigger (SNDRV_PCM_IOCTL_LINK). If linking
# fails they start back to back, reference first. If the reference cannot
# be opened at all, the mic runs without echo cancellation (logged).
link = true
# Mic-behind-reference delay: "auto" (measured at start and every 30 s,
# passed to AEC3 as a hint; AEC3 also tracks it itself) or a fixed number
# of ms (0 to 500). It changes on every open on c3-a (12.9 to 19.1 ms).
delay_ms = "auto"
# Noise suppression after the echo canceller (part of B + NS). Offline on
# c3-a recordings it raised wake detection in a quiet room and did not hurt
# with content (docs/experiments/P2-aec-offline-ab.md); live on c3-a it ran
# in EXP-018 and EXP-021 without measured harm or significant gain.
ns = true
# Skip the canceller while the reference has been silent for 2 s (never in
# the first 5 s of a stream), to save CPU. Not evaluated on the TV.
bypass_when_silent = false
reference_gain_db = 0.0  # digital gain on the reference, -20 to 40
# Reference channels given to the canceller: 1 = the downmix of all
# reference channels; 2 = the first two as a stereo render (AEC3 detects
# stereo content itself; part of B + NS). With fewer reference channels the
# canceller takes the downmix (warned).
render_channels = 2
# Which AEC3 output: "full" (linear filter plus residual-echo suppression),
# "linear" (the linear filter only) or "nearend" (full, with AEC3's near-end
# suppressor tuning all the time). The last two are experimental.
# Offline on c3-a recordings, the suppressor also removed most of a quiet
# talker under TV content (docs/experiments/P2-aec-offline-ab.md).
output = "full"
# File reference for mic.source = "file" (PC tests): raw interleaved frames
# in reference_format/channels/rate, read in lockstep with mic.path.
# reference_path = "ref.raw"  # example

[aec.aec3]
# AEC3 overrides (quoted names, webos_dsp::Aec3Param). These two are the
# built-in defaults (B, the best offline configuration on c3-a recordings,
# docs/experiments/P2-aec-tuning.md). A key set here replaces that default;
# defaults not named stay. AEC3's own values: "linear_mix" = 0.0,
# "ep_strength.default_len" = 0.83.
"linear_mix" = 0.4                # blend of the linear output (0 to 1)
"ep_strength.default_len" = 0.0

[music]
# Music through the satellite's media player (ADR 0010; design:
# docs/design/music-playback.md). Home Assistant (UI, scripts, automations)
# and Music Assistant's "Home Assistant Media Players" provider send a stream
# URL with play_media; the satellite fetches, decodes (FLAC, WAV, MP3, Ogg
# Vorbis) and plays it through a second pacat stream ("music"), and ducks it
# for the wake word, replies, announcements and the timer alarm. Off by
# default and experimental: built and tested on a PC only, not yet evaluated
# on a TV (CPU, mixing, false wakes). Changing it needs a restart; Home
# Assistant reads the entity's features when it connects. The TV app's Sound
# screen, the HA switch "Music playback" (music_enabled) and
# `ctl.sh config music on|off` change this key and restart.
enabled = false
# Format HA's ffmpeg proxy converts music to: "flac" or "wav" (MP3 is never
# advertised). rate (8000 to 96000) and channels (1 or 2) are advertised
# too. Playback follows the stream's own header, whatever it is.
format = "flac"
rate = 48000
channels = 2
# Offer play_media with announce: true (plays over the ducked music on the
# reply path; the music goes on).
announce = true
# Act on a media URL from an unencrypted API session. The daemon fetches
# that URL, so the default refuses it.
allow_plaintext = false
# While a voice run, a reply, an announcement or the timer alarm is active:
# "duck" (lower the music by duck_db), "pause" or "none".
on_wake = "duck"
duck_db = -20.0          # -60 to 0
duck_attack_ms = 50      # time to reach duck_db
duck_hold_ms = 800       # kept this long after the last source ended
duck_release_ms = 1000   # back to full level over this
# Music shares the reply volume (the media player's slider in HA, sink.gain
# applies too); gain_db trims music against replies (-60 to 12).
gain_db = 0.0
# Highest reply volume (percent) used for music; 100 = no cap.
max_volume_percent = 100
# pacat --latency-msec of the music stream (0 = PulseAudio's default) and how
# far ahead of the clock music is written: together they bound how late a
# duck, a pause or a stop is heard.
latency_msec = 100
write_ahead_ms = 60
# A stream that delivers no byte for this long ends the track (never retried).
idle_timeout_s = 10
# A pause longer than this drops the stream (the entity goes idle).
pause_timeout_s = 600
# After Home Assistant disconnects, music plays on for this long, then stops
# (a reconnect in time keeps it). The TV going to Active Standby or suspending
# always stops the music, and play_media is refused there; the satellite
# never wakes the TV for music.
disconnect_stop_s = 60

[remote]
# The Magic Remote's mic button (design: docs/design/remote-mic-button.md;
# ADR 0013). "off" (default): nothing of this feature is started (no reader,
# no device opened, no run, no stream, nothing of LG's changed).
# "ptt": hold the button to talk to Home Assistant: the press starts a run
# at speech-to-text (no wake word), the release ends its audio. It runs only
# while LG's assistant is kept off the button: at the start the satellite
# sets LG's voice key action (configd com.webos.keyaction.voice) to "ignore",
# in memory only, and gives it back when it stops (also after a crash, by the
# supervisor; by hand: ctl.sh restore-lg-voice; a TV restart clears it too).
# If that fails the feature stays off and says why (log, ctl.sh status, HA).
# LG may show "This function is not supported" on a press. The TV app's
# Sound screen, the HA switch "Remote mic button" (remote_mic_button) and
# `ctl.sh config mic-button on|off` change this key and restart.
mic_button = "off"
# The key's input device, by its exact name (never an eventN index), and the
# EV_KEY code (428 on LG C3, webOS 8.3, EXP-022).
device_name = "LGE M-RCU - Builtin [0]"
key_code = 428
# The run's audio from the remote's own microphone (LG's voiceinput stream,
# 16 kHz mono, opened at the press and closed at the release, the cap or the
# run's end); the TV microphone takes over when it fails. false: always the
# TV microphone.
remote_mic = true
# The audio ends this long after the press even if the button is held (1-60).
max_hold_s = 15
# A release before this many ms is a tap: the run goes on with the TV
# microphone and Home Assistant's end-of-speech detection ends it (0: no taps,
# every release ends the audio; at most 2000).
tap_ms = 300
# Fixed gain on the remote microphone in dB (-20 to 30); no echo canceller.
gain_db = 0.0
