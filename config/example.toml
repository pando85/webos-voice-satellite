# webos-satellite configuration (TOML). Every key is optional; the values
# shown are the defaults unless marked "example". Relative paths are resolved
# against the directory of this file. Command-line options override the file
# (see `webos-satellite --help`). Check a file with `--check-config`: it
# rejects unknown keys and bad values (naming the key) and prints warnings,
# for example when noise_psk_file is readable by group or other.
# Reference: docs/development.md#configuration-reference

# "wake": stream continuously while Home Assistant runs the wake word
#         (server-side openWakeWord, ADR 0003).
# "ptt":  push-to-talk; each SIGUSR1 starts one run at speech-to-text.
mode = "wake"

[device]
# ESPHome node name: lowercase letters, digits and '-', at most 31 chars.
# Must be unique among the ESPHome devices in your Home Assistant.
name = "webos-satellite"
friendly_name = "TV Voice Satellite"
# Stable MAC-style id that HA uses as the device's unique id. Either set it
# (example: "02:00:00:00:00:01", a locally administered address) or leave it
# unset and set mac_seed; with neither, it is derived from `name`.
# mac = "02:00:00:00:00:01"
# mac_seed = "some-random-stable-string"
model = "LG webOS TV"
bind = "0.0.0.0"
port = 6053
# Noise encryption key: base64 of 32 random bytes, the same value you enter
# as "encryption key" in HA. Keep it in a private file (mode 0600), e.g.
#   head -c 32 /dev/urandom | base64 > noise_psk && chmod 600 noise_psk
# Never commit it. `noise_psk = "..."` inline is accepted but not advised.
noise_psk_file = "noise_psk"
# Without a key the device refuses to start unless this is true
# (plaintext, development only).
allow_plaintext = false
# Advertise _esphomelib._tcp over mDNS. HA in a container/pod usually cannot
# see mDNS; add the device by host and port instead.
mdns = false
# Voice features advertised to HA (default 23 = announce only). Each is a
# bit of the ESPHome voice feature flags; the satellite behaves the same
# whether or not a bit is advertised, the bit only decides what HA offers.
# announce: HA may send announcements (bit 16). Needed for start_conversation.
announce = true
# timers: HA forwards its voice timers (bit 8). The satellite logs each
# change (id, event, seconds only; never the timer name) and "timer finished".
# There is no chime yet (docs/development/esphome-api.md#timers).
timers = false
# start_conversation: lets the assist_satellite.start_conversation service
# be called for this device (bit 32). Needs announce = true.
start_conversation = false

[mic]
# "alsa": the TV's built-in mic. "file": a raw recording (tests on a PC).
source = "alsa"
# ALSA: the card is found by id and the PCM by name (never by index).
card_id = "LGSIC"
pcm_name = "WoV PDM Mic"
# device = 0             # explicit PCM number, overrides pcm_name
rate = 16000             # must be 16000 (HA's rate; no resampling)
channels = 2
period_frames = 256      # the only period/buffer sizes c3-a accepts
buffer_frames = 8192
discard_ms = 250         # startup burst dropped after every (re)start
# File source: raw S24_LE interleaved (what `arecord -f S24_LE -t raw` writes),
# with `rate` and `channels` as above.
# path = "recording.raw" # example
realtime = true          # pace reads like a live mic
loop = false             # restart at end of file
skip_ms = 250            # skip the start of the file (startup burst)
pause_when_idle = true   # advance the file only while streaming to HA

[dsp]
channel = "left"         # "left" (ch0, ADR 0004), "right" or "mix"
gain_db = 24.0           # fixed gain; the C3 mic is quiet and has no AGC
hpf_hz = 120.0           # high-pass cutoff, 0 disables

[sink]
# "pacat": PulseAudio (the TV). "wav": one WAV file per reply in `dir`.
# "null": discard.
type = "pacat"
# Software gain on every sample written to pacat: 1.0 unity, 0.0 digital
# silence. On c3-a `pacat --volume` is ignored, so this is the level control;
# use 0.0 for silent tests.
gain = 1.0
binary = "pacat"
# device = "pcm_output"  # example PulseAudio sink; unset = default sink
# Streamed TTS (HA's default for this device) is sent to pacat at its native
# 16 kHz mono. rate/channels apply to decoded URL media (announcements).
rate = 44100
channels = 2
# pacat --latency-msec for replies and announcements. 0 = PulseAudio's
# default buffering (about 2 s), which delayed the start of short streamed
# replies by about 1.5 s on c3-a; 200 started them within about 0.1 s.
latency_msec = 200
dir = "."                # wav sink output directory

[log]
# error | warn | info | debug | trace. Audio is never logged; transcripts and
# reply text appear only at debug.
level = "info"

[safety]
# Kill switch: while this file exists the microphone PCM is closed (the
# hardware mic is released), nothing is streamed, and Home Assistant sees
# the "Mute microphone" switch on and cannot turn it off. Checked at startup
# and every 250 ms. `touch` it to stop listening, `rm` it to resume.
kill_switch = "/tmp/webos-satellite.disable"
# Remembers HA's mute switch across daemon restarts (created on mute, removed
# on unmute). Under /tmp it is lost at reboot; put it in a persistent
# directory if a mute must survive reboots.
mute_file = "/tmp/webos-satellite.muted"
# Firmware guard: the LG firmware versions (webos_manufacturing_version) the
# ALSA capture was validated on. On another version, or if firmware_info
# cannot be read, the satellite starts with the microphone disabled (shown
# as muted in HA). Check with `webos-satellite --check-firmware`. An empty
# list turns the guard off. File-mic tests are not gated.
validated_firmware = ["03.30.74"]
firmware_info = "/var/run/nyx/os_info.json"

[limits]
nice = 10                # scheduling niceness (also applies to pacat)
max_open_files = 256     # soft RLIMIT_NOFILE; 0 keeps the inherited limit
max_rss_mb = 64          # exit (code 72) above this resident size; 0 = off
capture_stall_s = 5      # reopen the ALSA device after this long without audio
loop_stall_s = 30        # exit (code 70/71) if the event loop or capture thread hangs

[pairing]
# Pairing without typing a key: Home Assistant 2026.9 or newer generates the
# Noise key and sets it on the device (ESPHome "dynamic encryption key"). Only
# used when [device] has no noise_psk / noise_psk_file: an explicit key always
# wins and disables pairing. Mutually exclusive with allow_plaintext.
# While unpaired the microphone stays closed and a keyless connection gets
# only hello, device info, an empty entity list and the key exchange, and
# only while the pairing window is open. Whoever on the LAN connects first
# during the window can claim the device (HA's zero-PSK key exchange stops
# sniffing but authenticates nobody), so keep the window short.
enabled = false
# Holds the stored key (noise_psk, mode 0600) and the trigger files: create
# `pair` to open the window, `reset-pairing` to delete the stored key and
# reopen it (the daemon deletes the trigger file; CLI: --pair, --reset-pairing).
state_dir = "pairing"
window_s = 600           # the window closes after this, or once a key is set
open_on_start = true     # open the window when started without a stored key

[aec]
# Acoustic echo cancellation: removes what the TV itself plays (programme
# audio and the satellite's own replies) from the mic before the gain, with
# WebRTC AEC3 (the pure Rust `sonora` crate). Design and measurements:
# docs/design/aec-frontend.md. Off until it is evaluated on the TV.
enabled = false
# The reference is the TV's output, captured from a PCM on the mic's card
# (mic.card_id), matched by its id or name (never by index). On the LG C3
# (c3-a) "SoundEngineCapture" (hw:LGSIC,3) is post-volume and coherent with
# the speaker signal; "SpeakerFeedback" is not usable as a reference.
reference_pcm_id = "SoundEngineCapture"
# The values verified on c3-a: S32_LE, 2 ch, 48 kHz (its only rate), period
# 256 and buffer 8192 frames. 48000 is decimated to 16 kHz; 16000 is
# taken as is. reference_format: "s32_le" or "s24_le".
reference_format = "s32_le"
reference_channels = 2
reference_rate = 48000
reference_period_frames = 256
reference_buffer_frames = 8192
# Start mic and reference on one trigger (SNDRV_PCM_IOCTL_LINK). If linking
# fails they start back to back, reference first. If the reference cannot
# be opened at all, the mic runs without echo cancellation (logged).
link = true
# Mic-behind-reference delay: "auto" (measured at start and every 30 s,
# passed to AEC3 as a hint; AEC3 also tracks it itself) or a fixed number
# of ms (0 to 500). It changes on every open on c3-a (12.9 to 19.1 ms).
delay_ms = "auto"
# Noise suppression after the echo canceller. Offline on c3-a recordings it
# raised wake detection in a quiet room and did not hurt with content
# (docs/experiments/P2-aec-offline-ab.md); not evaluated on a TV.
ns = false
# Skip the canceller while the reference has been silent for 2 s (never in
# the first 5 s of a stream), to save CPU. Not evaluated on the TV.
bypass_when_silent = false
reference_gain_db = 0.0  # digital gain on the reference, -20 to 40
# Reference channels given to the canceller: 1 = the downmix of all
# reference channels; 2 = the first two as a stereo render (AEC3 detects
# stereo content itself). Evaluated offline only (docs/experiments/
# P2-aec-offline-ab.md).
render_channels = 1
# Which AEC3 output: "full" (linear filter plus residual-echo suppression),
# "linear" (the linear filter only) or "nearend" (full, with AEC3's near-end
# suppressor tuning all the time). The last two are experimental and need
# render_channels = 1.
# Offline on c3-a recordings, the suppressor also removed most of a quiet
# talker under TV content (docs/experiments/P2-aec-offline-ab.md).
output = "full"
# File reference for mic.source = "file" (PC tests): raw interleaved frames
# in reference_format/channels/rate, read in lockstep with mic.path.
# reference_path = "ref.raw"  # example
