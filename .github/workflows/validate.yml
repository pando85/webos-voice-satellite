name: Validate research bootstrap
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check POSIX shell syntax
        run: sh -n tools/probe/probe.sh
      - name: Check research files and Markdown links
        run: python3 tools/check_docs.py
