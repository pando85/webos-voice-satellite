name: Validate research bootstrap
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check POSIX shell syntax
        run: |
          sh -n tools/probe/probe.sh
          for f in packaging/webos/*.sh packaging/webos/init.d/* packaging/webos/tests/*.sh packaging/webos/tv/*.sh tools/lifecycle/*.sh tools/lifecycle/tv/*.sh; do sh -n "$f"; done
      - name: Check research files and Markdown links
        run: python3 tools/check_docs.py
      - name: Unit tests of the PC-side report tool
        run: python3 -m unittest discover -s tools -p 'test_*.py'
