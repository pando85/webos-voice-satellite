name: Rust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_ZIGBUILD_VERSION: "0.24.0"
  ZIGLANG_VERSION: "0.16.0"
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (host, with the doc tests and the ignored slow tests)
        run: make test-full
      - name: Ops scripts (supervisor, crash-loop guard, autostart gating)
        run: sh packaging/webos/tests/run.sh
      - name: webOS app package lifecycle (install, update, boot hook, uninstall)
        run: sh packaging/webos/tests/ipk.sh
      - name: ctl.sh tv-settings and set (fake luna-send)
        run: sh packaging/webos/tests/tv_settings.sh
      - name: ctl.sh setup, set reply-volume (fake setup server)
        run: sh packaging/webos/tests/setup.sh
      - name: Status app smoke test
        run: node packaging/webos/tests/app_smoke.js
      - name: Assistant overlay app (model and page, fake webOS runtime)
        run: node packaging/webos/tests/overlay.js
  build-tv:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install pinned toolchain and targets (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo-zigbuild
        id: zigbuild-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-${{ env.CARGO_ZIGBUILD_VERSION }}
      - name: Install cargo-zigbuild
        if: steps.zigbuild-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked --version "$CARGO_ZIGBUILD_VERSION"
      - name: Install zig (pip, user-local venv)
        run: |
          python3 -m venv "$RUNNER_TEMP/zigvenv"
          "$RUNNER_TEMP/zigvenv/bin/pip" install "ziglang==$ZIGLANG_VERSION"
          echo "$RUNNER_TEMP/zigvenv/bin" >> "$GITHUB_PATH"
      - name: Build static armv7 musl (softfp flags from .cargo/config.toml)
        run: make build-tv
      - name: Build static aarch64 musl (comparison)
        run: make build-tv64
      - name: Check ELF properties
        run: |
          arm=target/armv7-unknown-linux-musleabi/release/webos-satellite
          a64=target/aarch64-unknown-linux-musl/release/webos-satellite
          file "$arm" "$a64"
          readelf -h "$arm"
          file "$arm" | grep -q "ELF 32-bit LSB executable, ARM, EABI5.*statically linked"
          readelf -h "$arm" | grep -q "0x5000200"
          file "$a64" | grep -q "ARM aarch64.*statically linked"
      - name: Smoke test the armv7 binary under qemu-user
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          qemu-arm-static target/armv7-unknown-linux-musleabi/release/webos-satellite --self-test
      - name: Checksums
        run: sha256sum target/*/release/webos-satellite
      - name: Build and check the webOS app package (not uploaded)
        run: make ipk
      - name: Upload armv7 binary (workflow artifact only, never committed)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webos-satellite-armv7-unknown-linux-musleabi
          path: target/armv7-unknown-linux-musleabi/release/webos-satellite
          if-no-files-found: error
          retention-days: 7
