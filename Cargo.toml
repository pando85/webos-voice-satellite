[workspace]
resolver = "3"
# Nightly-only libFuzzer targets with their own workspace (design M3b).
exclude = ["crates/playback/fuzz"]
members = [
    "crates/satellite",
    "crates/capture",
    "crates/compat",
    "crates/dsp",
    "crates/esphome-api",
    "crates/playback",
    "crates/remote-proxy",
    "crates/setup-server",
    "crates/tv-control",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Internal crates
webos-capture = { path = "crates/capture" }
webos-compat = { path = "crates/compat" }
webos-dsp = { path = "crates/dsp" }
webos-esphome-api = { path = "crates/esphome-api" }
webos-playback = { path = "crates/playback" }
webos-tv-control = { path = "crates/tv-control" }
# External crates (pure Rust: the TV build is static musl, no system libs)
rustix = { version = "1", default-features = false, features = ["std", "system", "param", "process", "time", "pty", "fs"] }
# Echo canceller: pure Rust port of WebRTC audio processing (AEC3, NS), BSD-3-Clause.
# Needs rustc 1.91. docs/research/aec-candidates.md, docs/design/aec-frontend.md.
sonora = { version = "0.2.0", default-features = false }
sonora-aec3 = { version = "0.2.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
doc_markdown = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# DSP runs per 10 ms frame on the TV: optimise it for speed, not size
# (sonora at opt-level "z" cost about 1.5x the CPU on the host,
# docs/research/aec-candidates.md#cpu-memory-size).
[profile.release.package.webos-dsp]
opt-level = 3
[profile.release.package.sonora]
opt-level = 3
[profile.release.package.sonora-aec3]
opt-level = 3
[profile.release.package.sonora-ns]
opt-level = 3
[profile.release.package.sonora-agc2]
opt-level = 3
[profile.release.package.sonora-fft]
opt-level = 3
[profile.release.package.sonora-simd]
opt-level = 3
[profile.release.package.sonora-common-audio]
opt-level = 3

[profile.dev]
panic = "unwind"

# The same DSP crates at opt-level 3 in the dev profile, which `cargo test`
# uses: at opt-level 0 the AEC3/NS tests (webos-dsp, and the satellite's
# capture tests that run the canceller) took minutes and many cores.
[profile.dev.package.webos-dsp]
opt-level = 3
[profile.dev.package.sonora]
opt-level = 3
[profile.dev.package.sonora-aec3]
opt-level = 3
[profile.dev.package.sonora-ns]
opt-level = 3
[profile.dev.package.sonora-agc2]
opt-level = 3
[profile.dev.package.sonora-fft]
opt-level = 3
[profile.dev.package.sonora-simd]
opt-level = 3
[profile.dev.package.sonora-common-audio]
opt-level = 3
# The decoders (symphonia) and the playback crate (resampler, gain, stream
# ring) as well: at opt-level 0 webos-playback's tests took about 15 minutes
# of one to four cores (the decoder mutation harness, the 64 MiB endless
# stream, the resampler checks); at 3 they take about 20 s. Overflow checks
# and debug assertions stay on (they are separate profile settings). An
# incremental rebuild after a playback edit costs about the same at 1 and 3.
[profile.dev.package.webos-playback]
opt-level = 3
[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-common]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.symphonia-metadata]
opt-level = 3
