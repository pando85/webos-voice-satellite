[package]
name = "webos-satellite"
description = "webos-voice-satellite: the satellite daemon binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "webos-satellite"
path = "src/main.rs"

[dependencies]
log = "0.4"
rustix = { workspace = true }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "macros", "sync", "time", "signal", "process", "io-util"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
webos-capture = { workspace = true }
webos-compat = { workspace = true }
webos-dsp = { workspace = true }
webos-esphome-api = { workspace = true }
webos-playback = { workspace = true }
webos-tv-control = { workspace = true }

# musl's malloc does not give memory back after TTS replies (RSS grew about 1.7
# bytes per reply byte on a PC musl build while Rust's live bytes stayed flat),
# so the static TV builds use this pure-Rust allocator. Host (glibc) builds keep
# the system allocator. docs/discovery/c3-a/P3-robustness.md.
[target.'cfg(target_env = "musl")'.dependencies]
dlmalloc = { version = "0.2", features = ["global"] }

[lints]
workspace = true
